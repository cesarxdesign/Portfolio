/* Every value here is read from Figma node 72:12550 (393x852),
   file 1m8o5tnDwNLpNhhcGJafgK. Nothing eyeballed.

   Last state of the onboarding downsheet ("downsheet / onb / 3"), after
   72:12476 (onb/2). All three hexagons are DONE - green #81F128 -> #65BC21
   rings and a checkmark.circle.fill each, no timing lines - the top stats read
   1 Devices / 5 Metrics, and the footnote is replaced by "Onboarding complete"
   in #f69a3c. The hexagons are a different component here ("hx 1/2/3" rather
   than "small hexa"): same 138.564x120 body, but a slightly larger ring,
   140.407x124 instead of 139.893x123.486, centred on the same box.

   Tokens on this node: hexa BG #161719 (baked into the hexagon SVGs), plus the
   effect tokens "drawer shadow", "shadow glass effects", "shadow glass stroke"
   (empty), "greed grady" (empty) and "shado". "shado" is the FRAME'S OWN drop
   shadow (0 2 24 #00000014, 0 1 2 #8D8D8D14) - device chrome, so not drawn.
   The frame's fill (#e0e0e0) and its real 20px corner radius are kept.

   Literal colors read off the node: downsheet fill #e0e0e0, hexa-grid plate
   #0c0c0c @8%, hexagon title #9da7b9, top-stats numbers/labels #a2abbc,
   "Online" #d8dfec, online dot #BADD2B, "Onboarding complete" #f69a3c, home
   indicator #e0e0e0, status bar type #fff, checkmark #85EC35. The sheet BG's
   own paint (black 78%, a 2px white 0.2->0 linear stroke, three drop shadows
   and a 0/20/50 white inner shadow) ships inside h3-bg.svg exactly as Figma
   exported it; its BACKGROUND_BLUR(20) is a no-op over flat #e0e0e0.

   "hexa mask" (72:12555) DOES have a live mask here - 72:12556 "Rectangle 154",
   393x1116 at 0,-176, is not hidden, unlike on onb/0..2. It clips the hexa grid
   to x 0..393 and y -176..940, which is strictly looser than the frame's own
   0..393 / 0..852 clip, so it removes nothing the frame does not already
   remove and needs no CSS of its own.

   Blend modes, all inside .fr's isolation: two of the 36 grid hexagons
   (Polygon 45 / 46, the 14th and 15th children) are hard-light, and each
   hexagon's fill plate is hard-light. The exported SVGs carry their own
   mix-blend-mode on the inner <g>; inside an <img> that inner blend resolves
   against a transparent backdrop (no-op), so hard-light is applied on the
   wrapper, exactly once.

   SF Symbols: figure.run, wand.and.sparkles and applewatch sit at exactly the
   coordinates 72:12346 derived from its PDF export (identical glyphs, identical
   hexa positions 144 / 282 / 426), so ob0-sf-*.svg are referenced rather than
   re-derived. checkmark.circle.fill is p4-sf-check.svg, the glyph identified
   and placed for 72:12404 - U+100063 out of SF-Pro-Text-Regular, 12px, ink
   11.953 square at 64.305,97.219 inside the hexagon, fill #85EC35; see
   profile-onb-1.ui's head comment for how it was pinned down. Figma's box for
   that glyph is the same 62.782,96 / 15x14 on all three hexagons here.

   Not rendered, and why:
     hidden=true - 72:12559 "pull fillet", 72:12560 "created" and its two
       labels.
     entirely outside the 393x852 frame - 72:12563 "wo 4" (y 945), 72:12564
       "wo 3" (y 1066), 72:12565 "wo 2" (y 1322), 72:12566 "wo 1" (y 1732),
       and the four parked hexagons 72:12572 "hx d" / 72:12574 "hx t" (both at
       127,-208), 72:12573 "hx r" (378,-208) and 72:12575 "hx l" (-156,-208).
     72:12553 "mask" is not drawn either: it IS the glow mask, used as one.

   Paint order trap, same as on 72:12346: "glow mask" is the FIRST child of the
   downsheet, so the white edge glow sits UNDER the 78%-black sheet. It is
   masked to the sheet-lip shape, placed at y=692 inside a 393x732 box, so only
   the wedge between the sloped lip and y=732 ever shows.

   The hexa-grid instance is a uniform 1.1493x scale of its 985.941x909.284
   master, so its hexagons are 159.098x137.783 (not the master's 138.564x120);
   each 156.622-wide SVG is centred in that box (+1.2382px). Its transform is
   identical to 72:12346/12404/12476's, so the same 36 positions apply.

   Figma reports text node w/h ceil'd to integers. Where Figma states a height
   it is pinned here as an explicit line-height so font metrics cannot drift
   the baseline (13->17, 11->14, 12->16).

   Asset inventory: 4 new SVGs (h3-*), all vector, none over 3 kB. Reused
   byte-identical (md5-verified): ob0-glowmask.svg, ob0-dot.svg,
   ob0-levels.svg. Referenced as-is: p4-hexa.svg (grid hexagon, same component
   and transform), p4-sf-check.svg, ob0-sf-watch/run/wand.svg. No raster
   assets on this screen, so no optimisation opportunities. */

.done{position:absolute;left:125px;top:678px;width:144px;height:16px;text-align:center;
      color:#f69a3c;letter-spacing:.4px;white-space:nowrap;
      font:500 12px/16px 'IBM Plex Mono',monospace;
      transform:translateY(2px)}
    /* Figma's box is 125,678 / 144x16 with a 16px leading and that is what is
       built; the 2px is a pure baseline compensation, measured against this
       node's own render, not eyeballed. Chrome puts this line's ink at
       680..691 where Figma puts it at 682..693 - same 12 rows, shifted whole -
       because Google's build of IBM Plex Mono sits slightly higher in the line
       box than the one Figma renders with. The same difference shows on the
       12px top-stats digits (Chrome 89..97, Figma 91..98) but there it is a
       glyph-HEIGHT difference, not a shift, so no nudge can fix it and none is
       applied; it costs about 100px of the frame. */

/* ---------- hx 1/2/3 (72:12571 / 72:12570 / 72:12569), 138.564x120 ---------- */
