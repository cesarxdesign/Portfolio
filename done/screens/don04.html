<style>
/* Every value here is read from Figma node 75:14895 (375x812),
   file 1m8o5tnDwNLpNhhcGJafgK, not eyeballed. get_variable_defs on this node
   returns {} - like the other Sketch-imported iPhone X screens in this file it
   binds no tokens at all, so every colour below is a literal read off the node
   or out of its own exported vector:
     frame #FFFFFF r24, header block #000000, lower plate #F4F4F4 with a 1px
     #979797 stroke, DONE pill #D1D1D1 with a 1px #4A4A4A stroke r65, DONE type
     #FFFFFF, title #FFFFFF with a 0 1 0 rgba(255,255,255,.5) text shadow,
     ruler rules #4A4A4A each with a 0 0 3 rgba(155,155,155,.2) shadow, the
     tumbler + Reps/Weight + set list #4A4A4A, "3/4" #101030, exercise plate
     #D8D8D8 @40%, progress track #CBCBCB with a #2CE5E8 fill, checkmarks
     #007AFF, the current-set dot #37D6E2, both pause glyphs #4A4A4A and
     #A33AC7, status bar white.

   NO DEVICE CHROME. The frame's own 1px black stroke AND its "Drop Shadow"
   effect (0 8 24 #AAAAAA3D) are chrome and are dropped; its #FFF fill and real
   24px radius are kept. Inside 75:14959 "iPhone foundation" the boolean-
   operation "iPhone X Frame" is hidden="true" in the file, and 75:14981
   "iPhone X/Home Indicator" is hidden too, so the only survivor is "Notch Copy"
   (219x31 at 78,0). Its export is byte-identical (md5
   3509589c316eeae37c5521573032b952) to assets/wo-notch.svg already in this
   folder, so that file is reused; the three status-bar icons are likewise
   byte-identical to assets/e1-battery.svg / e1-wifi.svg / e1-cellular.svg and
   are reused.

   Two alpha masks, both of which export as PLAIN RECTANGLES, so both ship as
   straight overflow:hidden clips rather than CSS mask images:
     75:14911 "Mask" 272x82 at 160,493 (path M0 0H272V82H0V0Z) - the rep/weight
       tumbler window. Its six 77x39 rows sit at y 474 / 510 / 546, so the top
       and bottom rows are cut in half by it, which is the whole effect.
     75:14930 "Mask" 341x328 at 17,103 (path M0 0H341V328H0V0Z) - the exercise
       photo window. The photo rect itself is 650x312 at -320,111, i.e. only its
       right end shows.
   75:14929, confusingly also named "Mask", is NOT a mask: it is a visible
   #D8D8D8 @40% plate filling the same 341x328 box, under the photo.

   The tumbler's current row (75:14916 / 75:14917) is IBM Plex Mono "Text",
   i.e. weight 450, against Regular 400 for the four dimmed rows (opacity .23).
   Google Fonts does not serve a 450 instance of IBM Plex Mono, so font-weight
   450 is declared and the browser resolves it to the nearest served weight;
   this is the one place on the screen where a value from the file cannot be
   honoured exactly. Flagged rather than silently swapped for 500.

   Figma reports text node w/h ceil'd to integers, and both faces here have an
   auto line height of exactly fontSize x 1.3 (IBM Plex hhea asc 1025, desc
   -275, upem 1000), which is what the boxes confirm: 40->52, 32->30 (explicit),
   30->39, 17->22, 14->18, 13->17. Where Figma states a height it is pinned
   here as an explicit line-height so font metrics cannot drift the baseline.
   Tracking is handled by the .tr span, not by letter-spacing on the block; see
   the note there.

   Hidden in the file, therefore not rendered: 75:14899 "Line + Line Copy + ...
   Mask" and its six children (the diagonal hatch behind the DONE pill),
   75:14924 "Group", 75:14960 "iPhone X Frame" and its three children, 75:14981
   "iPhone X/Home Indicator" and its bar.

   Asset inventory: 12 SVGs (we5-*) plus four reused byte-identical SVGs
   (wo-notch, e1-battery, e1-wifi, e1-cellular) and one raster: the exercise
   photo is byte-identical (md5 a9f1a3aa3f26aceac5df3dfaddd53588) to
   assets/as-photo.webp, so that file is reused untouched - the original
   7250x3458 RGBA export at 9.4 MB, drawn here at 650x312. That is a 11x
   downscale and the only optimisation opportunity on this screen; not
   performed. */
*{box-sizing:border-box}
p{margin:0}
body{margin:0;background:#dcdce0;font-family:'IBM Plex Mono',monospace;
     display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0 80px}
.cap{font:12px/1.4 ui-monospace,monospace;color:#6a6a72;letter-spacing:.03em}
.cap:target{display:none}   /* embedded at #e: no caption */
body:has(.cap:target){padding:0;gap:0;background:transparent}

.fr{position:relative;width:375px;height:812px;border-radius:24px;overflow:hidden;
    isolation:isolate;background:#fff}
.fr img{display:block;max-width:none}
/* Tracking lives on an inline span carrying margin-right:-tracking, never on the
   block. Figma's letterSpacing sits BETWEEN glyphs, CSS also adds it after the
   last one, so a centred line lands tracking/2 off. The negative margin cancels
   exactly the trailing spacing, so the line width equals Figma's. */
.tr{letter-spacing:var(--t);margin-right:calc(0px - var(--t))}
.sans{font-family:'IBM Plex Sans',sans-serif;font-variation-settings:'wdth' 100}

/* ---------- 75:14896 Rectangle, 375x360 at 0,452 ---------- */
.plate{position:absolute;left:-1px;top:451px;width:377px;height:362px;background:#f4f4f4;
       background-clip:padding-box;border:1px solid #979797}
    /* 1px stroke, OUTSIDE aligned. Figma's codegen boxes it at the node's own
       375x360, which would be an inside stroke; the file disagrees - the node's
       #F4F4F4 fill starts at y452 and the grey stroke sits on y451 - so the box
       is drawn at -1,451 / 377x362 with border-box sizing, which puts the
       padding box back on the node's exact 0,452 / 375x360. */

/* ---------- 75:14897 DONE (group) ---------- */
.donepill{position:absolute;left:37px;top:621px;width:302px;height:132px;background:#d1d1d1;
          background-clip:padding-box;border:1px solid #4a4a4a;border-radius:66px}
    /* 75:14898, 300x130 at 38,622 r65 - 1px stroke, OUTSIDE, same as .plate
       (Figma paints the #4A4A4A ring on y621 with the fill starting at 622).
       Outer radius 65+1; border-box gives the inner 65 back for free. */
.donefig{position:absolute;left:188px;top:614.302734375px;
         width:156.67578125px;height:134.17184448242188px}    /* 75:14906 */
.donetxt{position:absolute;left:133px;top:657px;width:110px;height:52px;color:#fff;
         text-align:center;text-transform:uppercase;white-space:nowrap;
         font:700 40px/52px 'IBM Plex Sans',sans-serif;font-variation-settings:'wdth' 100}

/* ---------- 75:14910 tumbler, 272x82 at 160,493 - plain rect mask -> clip --- */
.tum{position:absolute;left:160px;top:493px;width:272px;height:82px;overflow:hidden;
     color:#4a4a4a;text-align:center;white-space:nowrap}
.tum p{position:absolute;width:77px;height:39px;font-size:30px;line-height:39px}
.tum .a{left:2px}      /* 162 - 160 */
.tum .b{left:95px}     /* 255 - 160 */
.tum .dim{opacity:.23;font-weight:400}
.tum .cur{font-weight:450}   /* IBM Plex Mono "Text"; see head comment */

/* ---------- 75:14918 / 14919 / 14920 / 14921 rules, 81x1 ---------- */
.rule{position:absolute;width:81px;height:1px;background:#4a4a4a;
      box-shadow:0 0 3px 0 rgba(155,155,155,.2)}

/* ---------- 75:14922 Reps / 75:14923 Weight ---------- */
.hdlbl{position:absolute;top:473px;height:18px;color:#4a4a4a;text-align:center;white-space:nowrap;
       font:600 14px/18px 'IBM Plex Sans',sans-serif;font-variation-settings:'wdth' 100}

/* ---------- 75:14928 module/exerciseImage, 341x328 at 17,103 ---------- */
.eximg{position:absolute;left:17px;top:103px;width:341px;height:328px;overflow:hidden}
.eximg .pl{position:absolute;left:0;top:0;width:341px;height:328px}   /* 75:14929 */
.eximg .ph{position:absolute;left:-337px;top:8px;width:650px;height:312px}  /* 75:14931 */

/* ---------- loose labels ---------- */
.setno{position:absolute;left:38px;top:462px;width:31px;height:22px;color:#101030;
       text-align:right;white-space:nowrap;font:500 17px/22px 'IBM Plex Mono',monospace}
.setrow{position:absolute;left:39px;width:78px;height:17px;color:#4a4a4a;white-space:nowrap;
        font:500 13px/17px 'IBM Plex Mono',monospace}

/* ---------- 75:14934 Group 5 (contents) ---------- */
.pause2{position:absolute;left:38px;top:573px;width:18px;height:18px}   /* 75:14938 */
.chk{position:absolute;left:126px;width:13px;height:10px}
.ovaldot{position:absolute;left:129px;top:516px;width:7px;height:7px}   /* 75:14948 */

/* ---------- 75:14949 header block, 375x88 at 0,0 ---------- */
.hdr{position:absolute;left:0;top:0;width:375px;height:88px;background:#000}

/* ---------- 75:14950 item/progressBar, 375x6 at 0,806 ---------- */
.pbtrack{position:absolute;left:0;top:806px;width:375px;height:6px;background:#cbcbcb;
         backdrop-filter:blur(2.718px)}
.pbfill{position:absolute;left:0;top:806px;width:290px;height:6px;background:#2ce5e8;
        backdrop-filter:blur(2.718px)}

/* ---------- 75:14954 Title Label, 79x22 at 148,776 ---------- */
.clock{position:absolute;left:148px;top:776px;width:79px;height:22px;color:#4a4a4a;
       text-align:center;white-space:nowrap;--t:-.41px;
       font:600 17px/22px 'IBM Plex Mono',monospace}

/* ---------- 75:14955 pause icon 19x19 at 22,56 / 75:14993 Group 3 at 342,56 -- */
.pause{position:absolute;left:22px;top:56px;width:19px;height:19px}
.grp3{position:absolute;left:342px;top:56px;width:19px;height:19px}

/* ---------- 75:14959 iPhone foundation ---------- */
.notch{position:absolute;left:78px;top:0;width:219px;height:31px}
.sbtime{position:absolute;left:20.944149017333984px;top:14px;width:54px;text-align:center;
        color:#fff;white-space:nowrap;--t:-.3px;
        font:600 15px/normal 'SF Pro Text',-apple-system,sans-serif}
.sbcell{position:absolute;left:293.21807861328125px;top:17.666667938232422px;
        width:16.955078125px;height:10.6669921875px}
.sbwifi{position:absolute;left:315.1595764160156px;top:17.330673217773438px;
        width:15.292977333068848px;height:10.999981880187988px}
.sbbatt{position:absolute;left:335.4388122558594px;top:17.33333396911621px;
        width:24.263336181640625px;height:11.333332061767578px}

/* ---------- 75:14983 Center, 4 dots 7x7 at y433 ---------- */
.dot{position:absolute;top:433px;width:7px;height:7px}

/* ---------- 75:14992 title, 275x30 at 50,51 ---------- */
.title{position:absolute;left:50px;top:51px;width:275px;height:30px;color:#fff;
       text-align:center;white-space:nowrap;--t:-1.7778px;
       text-shadow:0 1px 0 rgba(255,255,255,.5);
       font:700 32px/30px 'IBM Plex Sans',sans-serif;font-variation-settings:'wdth' 100}

/* ---------- 75:14996 Line 2, 27x2 at 5,518 -> its art fills the lower half --- */
.line2{position:absolute;left:4.5px;top:519px;width:27.5px;height:1px}
