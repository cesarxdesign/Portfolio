<!doctype html>

<style>
/* Every value here is read from Figma node 75:13534 (375x812),
   file 1m8o5tnDwNLpNhhcGJafgK, not eyeballed. get_variable_defs on this node
   returns {} - the screen is an early Sketch-imported wireframe and binds no
   tokens at all, so every colour below is a literal read off the node:
     frame #FFFFFF, placeholder plates #D8D8D8 with #979797 strokes,
     menu button #F8E71C w/ 8px #979797 stroke r10, nav+tab bars
     rgba(33,33,33,.72) over a 13.591px backdrop blur, iOS orange #FF9500,
     the mock type #A46A19, play chip #C82A2A, picker base #5E4848 and its
     #CDCDCD .5px inner shadows, home indicator white @14%.
   Bar hairlines are Figma drop shadows with zero blur: nav bar 0 +0.5 0
   rgba(255,255,255,.16) (read off the exported vector's feDropShadow), tab
   bar 0 -0.5 0 rgba(255,255,255,.15).

   NO DEVICE CHROME. The frame's own 1px black stroke is chrome and is dropped;
   its #FFF fill and real 24px radius are kept. 75:13864 "iPhone X/iPhone X
   Frame" is chrome drawn INSIDE the frame, and it resolves to nothing but the
   notch: its boolean op paints (a) four corner wedges that are exactly the
   area outside a 24px radius - i.e. exactly what the frame's own 24px clip
   already removes, verified by reading the exported path (M0 788 -> arc ->
   24 812) against the frame's rounded-[24px] overflow-clip - and (b) a
   #BD10E0 notch silhouette that 75:13869 "Notch Copy" then covers completely
   in black. So only the black notch survives, and only the black notch ships.
   Its exported SVG is byte-identical (md5 3509589c316eeae37c5521573032b952)
   to assets/wo-notch.svg already in this folder, so that file is reused.

   Hidden in the file, therefore not rendered: 75:13546 "IMG_C5636E5E9B2E-1"
   (375x812 photo, hidden). 75:13872 "Mask" (50x124) exports as an empty <g>
   and paints nothing; 75:13873 is its twin acting as the Date Picker's mask
   layer, and that mask is a plain filled 50x124 rect, so it is reproduced as
   a straight overflow:hidden clip at 171,487 - which is what cuts the picker's
   Sat 5 / Sun 6 rows off the top and the Sat 12 / Sun 13 rows off the bottom.
   75:13871 "Base" sits BELOW the mask layer and is deliberately outside the
   clip (it is 140 tall against the clip's 124).

   Type: SF Pro Text / SF Pro Display throughout, exactly as the file names
   them. Figma's auto line height for these faces is fontSize x ~1.1933
   (hhea asc 1950, desc -494, upem 2048), which is what the browser's
   line-height:normal computes too, so "normal" leadings are left to the
   browser and only Figma's explicit leadings (22 / 32.304 / 41) are pinned.
   Tracking is handled by the .tr span below, not by letter-spacing on the
   block; see the note there.

   Groups (75:13537 film strip, 75:13544 Menu Button, 75:13870 Date Picker
   Copy) are display:contents in Figma's own output and carry no geometry;
   their children are positioned directly. Coordinates in Figma's metadata are
   given in the top-level frame's space except inside real frames (Home
   Indicator, Nav Bar, Status Bar, Time Style, Date Picker's vector rows),
   where they are parent-relative and are resolved here.

   Asset inventory: 19 SVGs, e1-* plus the shared wo-notch.svg. The "exercise
   image" is a vector illustration, not a bitmap (Figma hands it back as SVG
   despite the .png-looking URL) and is by far the heaviest at 120 kB; the
   spinner's angular gradient is the next at 8.6 kB. No raster assets on this
   screen. Three exports were fetched and then dropped because nothing renders
   them: the nav bar's flat background vector (rebuilt in CSS so the backdrop
   blur is real), and the two Date Picker mask rects (see above). */
*{box-sizing:border-box}
p{margin:0}
body{margin:0;background:#dcdce0;font-family:-apple-system,'SF Pro Text',sans-serif;
     display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 0 80px}
.cap{font:12px/1.4 ui-monospace,monospace;color:#6a6a72;letter-spacing:.03em}
.cap:target{display:none}   /* embedded at #e: no caption */
body:has(.cap:target){padding:0;gap:0;background:transparent}

.fr{position:relative;width:375px;height:812px;border-radius:24px;overflow:hidden;
    isolation:isolate;background:#fff}
.fr img{display:block;max-width:none}
/* Tracking lives on an inline span carrying margin-right:-tracking, never on the
   block. Figma's letterSpacing sits BETWEEN glyphs, CSS also adds it after the
   last one, so a centred line lands tracking/2 off - and when the padded line
   then overflows its box Chrome stops centring altogether and pins it left,
   which is how a 3.6268px tracking turned into a 4px shift. The negative
   margin cancels exactly the trailing spacing, so the line width equals
   Figma's and centring behaves. Verified: "15.0" lands at 240.219 against
   Figma's 240.22, "DONE" at 119.391, "H" at 291.203. */
.tr{letter-spacing:var(--t);margin-right:calc(0px - var(--t))}

/* ---------- 75:13535 Rectangle 5 Copy, 78x41 at 234,530 ---------- */
.r5{position:absolute;left:234px;top:530px;width:78px;height:41px;background:#d8d8d8;
    box-shadow:inset 0 0 0 1.468px #979797}
    /* inset ring, not `border`: Chrome snaps used border-widths to whole device
       pixels and would draw Figma's 1.468px stroke as 1px. */

/* ---------- 75:13536 Background (tab bar), 375x83 at 0,729 ---------- */
.tabbar{position:absolute;left:0;top:729px;width:375px;height:83px;
        background:rgba(33,33,33,.72);backdrop-filter:blur(13.591px);
        box-shadow:0 -.5px 0 0 rgba(255,255,255,.15)}

/* ---------- 75:13537 film strip (group), six 48x48 at y747 ---------- */
.film i{position:absolute;top:747px;width:48px;height:48px;
        background:#d8d8d8;border:1px solid #979797}

/* ---------- 75:13544 Menu Button (group) -> 75:13545, 174x89 at 100,640 ---
   8px stroke, CENTER aligned: the node's render bounds are 182x97 against a
   174x89 geometry box, so the stroke straddles the edge 4px either side.
   Box therefore drawn at 96,636 / 182x97 with radius 10+4=14 (Figma's r10 is
   on the geometry rect; border-box gives the inner 14-8=6 for free). */
.menubtn{position:absolute;left:96px;top:636px;width:182px;height:97px;
         background:#f8e71c;border:8px solid #979797;border-radius:14px}
