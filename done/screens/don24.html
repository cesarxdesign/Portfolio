/* Every value here is read from Figma node 86:26039 "Workout" (393x852), file
   1m8o5tnDwNLpNhhcGJafgK, not eyeballed. Third-generation DONE workout screen:
   the same component set as 71:10967 (don16.ui) with a bench-press photo, a
   START hexagon instead of the DONE/tumbler pair, and the downsheet parked one
   sheet-height above the screen instead of hidden.

   Tokens on this node: hexa BG #161719 (baked into the hexagon SVGs),
   Foreground/primary #FFFFFF, and four styles that resolve EMPTY from
   get_variable_defs - "linear pink", "hexa stroke", "Angular Gradients/Angular 1",
   "shadow glass stroke" - all recovered from the frame's own vector export.
   "drawer shadow" = 0 4 4 #FFFFFF40 + 0 2 80 #FFFFFF29 (the downsheet glow).
   Literal colors read off the node: frame fill #E0E0E0, clock plate #000 @ .5,
   #464646 (Bench Press), #3E3E3E (Barbell / Sets block), #ECEDCE (START),
   #FF8100 (set marker), #E1E1E1 @ .72 (navbar glass), #0C0C0C (downsheet grid),
   nav pill #81F128 -> #71E517.

   NO DEVICE CHROME: the frame's own 1px #AAAAAA stroke is dropped. Its #E0E0E0
   fill and its real 32px corner radius are kept. get_design_context reports
   every child against the BORDER box (left/top 1px short); the coordinates
   here are the file's own metadata tree.

   TRAP - get_design_context lies about the clock's two rings. It emits
   `border border-solid border-white` for both 86:26088 and 86:26093. The
   frame's SVG export paints, in order: r12 rect #000 @ .5; a 1px inside ring
   white @ .07; a 1px inside ring white a0 -> a1 along (156.403,110.519) ->
   (160.308,69.163), BM overlay; the three glyph runs; the 349x64 angular Glow
   (BM screen, opacity .2); a 1px inside ring white a1 -> a.5 along
   (196.5,80) -> (196.5,124), BM overlay. Both gradient axes are offsets of
   don16.ui's PURELY PERPENDICULAR to their own direction, so the two ring
   assets are byte-identical and are reused.

   TRAP - "Bench Press" carries an UNDECLARED OUTSIDE STROKE. codegen renders
   it as plain #464646 text; the export adds a masked 0.4px outside stroke
   painted with the "hexa stroke" gradient (#F68B2E -> #F69A3C @.095 ->
   #F6A94A @.27 -> #F6BB5C @0 @.545, along (115.038,193.467)->(113.876,129.221)).
   A gradient text-stroke has no CSS equivalent, so it ships as
   bp-h1-stroke.svg: Figma's own outline plus its outside-mask, at the export's
   own ink box (41,154,146x20). The FILL stays real text.

   TRAP - get_design_context drops the START hexagon fill's node opacity (0.8)
   while reporting its blend mode. It is baked inside bp-hexa-fill.svg, so only
   mix-blend-mode:hard-light is set in CSS - do NOT add opacity on top. The
   0.5 opacity of the stroke is baked into bp-hexa-stroke.svg the same way.

   THE NAVBAR IS ON SCREEN, 2px of it. 86:26094 sits at y 850 and is 106 tall,
   so only its top edge is inside the frame: the #E1E1E1 @ .72 glass and its
   1px stroke, which is a GRADIENT (white a.2 -> white a0 along
   (33.686,850)->(397.164,938.991)), not the flat rgba(255,255,255,.2) codegen
   claims. Same axis as don22.ui's navbar, so wp-nav-ring.svg is reused. Its
   five glyphs sit at y ~872 and are entirely below the cut.

   THE DOWNSHEET IS ON SCREEN, 98px of it, and almost all of that is empty.
   86:26095 "downsheet final" is at y -754 and is 852 tall, so its bottom 98px
   overlap the top of the frame. Everything the sheet draws is either above the
   cut (pull fillet -36, hexa metrics, workout stack, its own status bar) or
   masked away: BG / shadow / hexa grid are all masked by a 405x889 alpha mask
   at -6,-2 on layers that start at sheet-y -145, i.e. the mask runs out at
   sheet-y 742 and the visible band starts at 754. What DOES reach the screen
   is the "glow mask" group at sheet-y 692: a black plate that ends at frame
   y -22 with a soft white drop shadow (0 2 80 #FFFFFF29) spilling down to
   y 60 - the SVG filter region stops there. Byte-identical to don22.ui's
   wp-glow.svg, which is reused; that file carries the second, tight
   0 4 4 #FFFFFF40 shadow too, which the frame export drops because it never
   reaches y 0 (the plate edge is at -22, the shadow dies by -14).

   Hidden in the file, therefore not rendered: 86:26049 "SAVE" (the DONE
   hexagon at 251,638), 86:26057 "tumblr" (the whole load/reps picker at
   4,636), 86:26082 "image.scaledToFill()" (the older photo rect inside IMAGE).

   The IMAGE frame (86:26081) does NOT clip: its 482x354.698 multiply-blended
   child runs from y 177.651 to 532.349 and x -67 to 415 and is cut only by the
   frame edge, so it sits over the first two "Sets" rows and under the H1.
   Figma's pattern maps the whole 2870x2112 source onto the rect with no crop
   (2870/2112 = 482/354.698), so a plain 100%/100% stretch is exact.

   SF Symbols are text glyphs in Figma and render as bar stacks outside
   SF-aware contexts. Both were already traced for don16.ui and their ink
   boxes in THIS frame's outlined export match to 4 decimals, so both assets
   are reused: pause.circle ink 327.430..343.570 x 94.289..110.430 (asset
   placed at 326.03125,94.2890625) and arrowtriangle.right.fill ink
   259.121..266.446 x 537.268..544.396 (asset placed at -16.879395,5.267578
   inside its 81x17 row).

   Text: real text, never outlines. Figma's hug width EXCLUDES the trailing
   letter-space and is then ceil'd to an integer ("Bench Press" 158.4 - 10 =
   148.4 -> 149), and a hugging run starts at its node's own x UNLESS the node
   itself carries an alignment - checked against the export's ink: "Sets" at
   324.507 for a node at 324 and the four "124.0 x 12" rows at 276.689 for
   nodes at 276 are all flush left even though their parent is items-end, while
   "Barbell" is the one node the file marks text-right and it lands 0.6px
   further right, exactly the 57 - 56.4 its ceil'd box has spare. CSS
   letter-spacing trails the last glyph where Figma's does not, so right-
   aligning in CSS only recovers 0.3 of that 0.6; the other 0.3 is its --dx.
   Only the clock's timer and the hexagon label sit in real fixed boxes and
   stay centred.

   Line height: Figma's auto for IBM Plex Mono is round(1.3*size) - 24 -> 31,
   13 -> 17 - pinned here so font metrics cannot drift a baseline. Every run
   was then measured against the outlined export by 1-D edge-energy cross-
   correlation at 4x (the fixed images in the same frame calibrate to 0.000)
   and nudged with --dy, never assumed:
     START           +0.63   24/31
     Bench Press     +0.53   24/31  (its stroke SVG stays put)
     Sets            +0.30   13/24, the one explicit line height
     124.0 x 12 (x4) -0.22   13/17
     Barbell         -0.21   13/17
   The clock's two 16/24 runs measured -0.07 and -0.05 and are left alone.
   9:41 is SF Pro, which Chrome substitutes: its box is exact and its ink
   centre lands within 0.23px, but the substituted glyphs are a shade narrower
   and heavier than Figma's. Not faked.

   NEW ASSETS (bp- prefix): bp-photo.webp (the 2870x2112 bench-press original,
   untouched), bp-hexa-fill.svg / bp-hexa-stroke.svg (the START hexagon, 168.407
   and 171.893 wide - wider than every hexagon already in assets/),
   bp-navpill.svg (the 26x10 green progress pill), bp-h1-stroke.svg.

   ASSETS REUSED BYTE-FOR-BYTE (md5-checked after normalising Figma's
   per-export gradient/filter id renumbering, which never matches):
     wh-hexa.svg            the grid hexagon (136.273x119.883)
     wh-navdot.svg          the two inactive nav dots
     wh-levels.svg          the status-bar levels group
     wh-btn-ring1/2.svg     the clock's two gradient rings
     wh-sf-pausecircle.svg  pause.circle
     wh-sf-tri-right.svg    arrowtriangle.right.fill, #FF8100
     wp-glow.svg            the downsheet's bottom glow
     wp-nav-ring.svg        the navbar's gradient stroke
   The hexa grid instance is also identical to don19.ui's: same 34 children,
   same order, same per-child percentage insets, so that block is lifted whole. */

/* ---------- clock 86:26087, 329x44 at 32,80 ------------------------------- */
.bg{position:absolute;left:32px;top:80px;width:329px;height:44px}
/* Figma insets the plate by half its 1px stroke: the export writes the fill AND
   the white a.07 stroke as one r11.5 rect at 32.5,80.5 328x43, so the outer
   half-pixel of the 329x44 box carries stroke only, no #000 a.5. Painting the
   fill edge-to-edge instead darkens that half-pixel by up to 27 levels where
   ring 2's alpha has fallen off (bottom edge 193 vs 243). */
.bg .fill{position:absolute;left:.5px;top:.5px;width:328px;height:43px;
          border-radius:11.5px;background:rgba(0,0,0,.5);
          box-shadow:inset 0 0 0 .5px rgba(255,255,255,.07),
                           0 0 0 .5px rgba(255,255,255,.07)}
.bg .ring{position:absolute;left:0;top:0;width:329px;height:44px;mix-blend-mode:overlay}
.bg p{position:absolute;top:10px;height:24px;font-size:16px;line-height:24px;color:#fff}

      mix-blend-mode:screen;opacity:.2}
.glow u{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;
      transform:matrix(-8.1119,5.2923,-14.648,-2.9307,174.5,32)}
