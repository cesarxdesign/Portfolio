/* Every value here is read from Figma node 71:10967 (393x852), file
   1m8o5tnDwNLpNhhcGJafgK, not eyeballed. Second-generation DONE workout screen
   (hexa language); unrelated to workout.ui / workout-bench.ui (68:6899/68:7181).

   Tokens on this node: hexa BG #161719, Foreground/primary #FFFFFF, and the
   "shado" effect style = 0 2 24 #00000014 + 0 1 2 #8D8D8D14 (both on the frame).
   Frame fill #E0E0E0, corner radius 20, clipped. NO device outline on this one:
   unlike 68:6899 the frame carries no stroke, so none is drawn. Literal colors
   in the file: #464646 (Bicep Curls), #3E3E3E (Dumbbells / Sets block),
   #7B7B7B (Load/Reps labels), #ECEDCE (DONE + tumbler), #FF8100 (set marker),
   #FFBE7C + rgba(255,190,124,.24) (active nav pill).

   TRAP — get_design_context lies about the Glow Button's rings. It emits
   `border border-solid border-white` for BOTH node 71:10986 and node 71:10991, and get_variable_defs returns "" for "linear pink", "hexa stroke"
   and "Angular Gradients/Angular 1". The frame's PDF export (node 71:10985)
   shows what is really painted, in this order:
     1. rounded rect r12, #000 @ ca .5                     (button fill)
     2. 1px inside ring, white @ ca .07                    (button stroke 1)
     3. 1px inside ring, white, alpha 0 -> 1 along
        PDF pattern matrix [3.90502 41.35649 -41.35649
        3.90502 49.599657 31.48829], BM /Overlay           (button stroke 2)
     4. the three white glyph runs
     5. the Glow: full 349x64 r12 rect, angular gradient, BM /Screen, ca .2
     6. 1px inside ring, white, alpha 1 -> .5 along
        matrix [0 -44 44 0 -34 54], BM /Overlay            (node 71:10991)
   Both gradient rings resolve to a constant white colour (PDF FunctionType 4
   returns 1,1,1 for every t); the whole gradient lives in the /SMask alpha.
   Rings 3 and 6 ship as wh-btn-ring1.svg / wh-btn-ring2.svg with those exact
   axes; ring 2 is an inset box-shadow. The angular Glow is the conic-gradient
   Figma itself emits, placed through Figma's own matrix instead of its
   <foreignObject> data-URI (foreignObject does not render inside a CSS
   background image).

   SF Symbols are text glyphs in Figma and render as bar stacks outside
   SF-aware contexts, so both were traced out of the PDF exports:
   pause.circle (71:10989) ink 17.539x16.141 at 294.031,14.289 inside the
   button; arrowtriangle.right.fill (71:11001) ink 7.326x7.128 at
   -16.879,5.268 inside its 81x17 row.

   Hidden in the file, therefore not rendered: 71:10968 "BG", 71:10970 "Shape",
   71:10971 "Vector", 71:10972 "navbar", 71:10974 "downsheet 2".

   The IMAGE frame (71:11003) does NOT clip (clipsContent false): its 491.735x366
   multiply-blended child runs from y -16 to 350 and x -53 to 438.7 and is cut
   only by the screen edge, so it sits over the "Bicep Curls" and "Sets" type.
   Raw image inventory: the bicep-curls photo is byte-identical to workout.ui's
   (sha1 dcfbbb74…), so assets/wo-bicep.webp is REUSED — untouched 3608x2026
   original, 1.2 MB. Figma's fill transform (left -20.27%, w 134.4%) is CSS.

   Line height: where Figma says "auto" its box is 31px at 24px type, 17 at 13,
   14 at 11. Chrome's `normal` matches at 13 and 11 but gives 32 at 24, so the
   24px runs (Bicep Curls, DONE, the three tumbler rows) carry an explicit
   31px. Chrome then floors half-leading to whole pixels while Figma keeps it
   fractional, which drops a TOP-anchored run by up to 1px (centred runs are
   unaffected). The two top-anchored ones get the box height they have in
   Figma plus a line-height 2px larger, which lands the baseline where Figma
   puts it without moving the box: Bicep Curls 31/33, Sets 24/26. Measured on
   the render, that pulls those two runs from 24%/19% mismatched pixels to
   15%/6%. Text-node widths that the file pins by hand rather than hugging
   (149 / 73 / 33 / 81) are pinned here too, so the runs start where Figma
   starts them; CSS letter-spacing also trails the last glyph where Figma's
   does not, which is why hugging alone lands up to .6px off.

   The hexa grid (71:10969) is 36 instances of one vector at 8% opacity,
   mix-blend plus-lighter; two of them (25/26 in DOM order) use the hard-light
   variant. Every inset is the file's own percentage, not a rounded pixel. */
