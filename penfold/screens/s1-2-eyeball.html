/* Figma node 3:1622 "EYEBALL". This screen is a collage: one 781x3272 PNG of the
   real app, displayed at 390.5x1636 and cropped five different ways, with flat
   #F6F6F6 rectangles masking parts of it and a few live vector layers on top.

   WHERE EACH VALUE CAME FROM, since this node was expected to resist reading:
   - geometry: get_metadata, then get_design_context for the crop offsets, which
     it reports as percentages of each crop box. Those percentages are used
     verbatim rather than resolved by hand, so the browser does the same
     arithmetic Figma did. All five crops resolve to the same 390.5 x 1636.05
     image, which the PNG confirms: it exports at 781x3272, exactly 2x.
   - color: get_design_context did return real fills here, because the flat
     layers are vector rectangles rather than raster. They were cross-checked by
     sampling the PNG with PIL: the app's own background samples #F6F6F6 at
     display (200,381) and (20,609), which is exactly the #F6F6F6 that the
     rectangles and the frame are filled with, so the masks blend into the
     screenshot as intended. The donut ring samples #DE517E and the app's header
     strip #FFFFFF; both are raster content, not tokens, and are not reproduced
     as CSS anywhere.
   - type: also read, not derived. get_design_context gives Montserrat ExtraBold
     24.25px for the three "Complete" labels and for "Hi Joe", and Montserrat
     Bold 14px for the three field labels. 24.25 is an odd size and it is the
     file's own; it is not rounded here. ExtraBold is why this file loads
     Montserrat 800, which none of the other screens need.

   Tokens: Cool blue #123456, Fill with blur #FBFBFB, Grey #CCCCCC,
   White #FFFFFF, Pinkfold #FF5081, Light blue #4ECFEF.
   "mobile blur (92% fill)" is a BACKGROUND_BLUR of radius 4, which is CSS
   backdrop-filter blur(2px). The pill green #7FD944 and the frame's #F6F6F6
   have no variable behind them.

   Paint order matters more than usual here, because most of the screen is one
   layer covering another. Bottom to top: the tall 3:1624 crop, the three green
   "Complete" rows, the 3:1707 frame, "Hi Joe", the 3:1708 mask that erases the
   screenshot from y=517 to y=823, the 3:1709 band that paints the icon row back
   in at y=637 to y=766, the header, the iOS bar, and last of all the 3:1645
   crop, which sits ON TOP of the header and supplies its Total Pot figures.
   The green rows and the 3:1707 frame end up completely hidden underneath the
   masks; they are still built, because they are in the file.

   3:1623, 3:1626, 3:1627 and their siblings are GROUPS, so get_metadata reports
   their children against the frame and not against the group. 3:1707 and 3:1709
   are real frames that clip, and their children ARE frame-relative: 3:1689
   reports y=-325 inside 3:1709, which puts it at 312 on the screen.

   Reused assets, each proved byte-identical to its existing copy: logo-a/b/c
   and btn-menu-circle. ic-chevron-large is NOT reused: this node's copy is the
   same path stroked #FF5081 instead of #123456, so it is saved separately. */
