/* Every value here is read from Figma node 3:4062 "v3", not eyeballed.

   Tokens: Cool blue #123456, Pinkfold #FF5081, White #FFFFFF, Grey #CCCCCC,
   Light Blue #E7EBED, Cool grey #FBFBFB, F0F0F0, Background #F4F4F4.
   Type: H1.m Bold 28 (lineHeight 1.04, letterSpacing -1), T1 Bold 28 (ls 0),
   H3.m Bold 24 (ls -1), T2 Bold 20, T3.m Medium 12 (lineHeight 20).
   Two colors have no variable behind them: the graph's #5C85D6 "Paid in" bars
   and #20499A "Growth" bars.

   Flip and rotation traps, all cross-checked between get_metadata and
   get_design_context. get_metadata reports a transformed node's origin AFTER
   the transform, so the reported x or y is the far edge, not the box:
   - 3:4170 icon/chevronRight reports 46,44 inside a 120x44 button. It is
     rotated 180deg, so its true box is 2,0 (46-44, 44-44). That 180 is also
     why the chevron reads as a left-pointing Back arrow: the artwork is a
     down-chevron, turned -90deg inside the icon and then 180deg with the icon.
     The generated code kept only the inner -90 and lost the 180.
   - 3:4147 the recurring icon reports x=40 in an 82-wide frame. It is flipped
     horizontally, so its true left is 0.
   - 3:4072 and 3:4074, the two 8px graph key dots, report y=85. They are
     flipped vertically, so their true top is 77. Being circles, the flip
     itself is a visual no-op and is not reproduced.

   One genuine disagreement between the two tools, flagged rather than guessed:
   for the "Saving" title 3:4174, get_metadata gives 248,21 95x29 while
   get_design_context computes left 68.8% (258) and width 85. Both put the
   right edge at 343 and the type is right-aligned, so the glyphs land in the
   same place either way. get_metadata's box is the one used here.

   3:4053's chevron slot is 4x8 and the artwork inside it is 8x4, i.e. the
   rotated pair, exactly as on s4-2. The 11 x 7.62132 export is byte-identical
   to that screen's ic-chevron-small.svg apart from its layer id, so it is
   reused. */
